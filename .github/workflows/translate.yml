name: Auto Translate Blog Posts (zh -> en)

# 中文博客新增/修改时，自动翻译成英文并提交（护栏版，见 scripts/auto-translate.mjs）
# 护栏要点：英文版若已人工撰写则跳过；译文不合格不落盘；模型名自动探测
on:
  push:
    paths:
      - 'src/content/blog/zh/**/*.md'
    branches:
      - main

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed Chinese posts
        id: changed
        run: |
          echo "files=$(git diff --name-only HEAD^ HEAD | grep 'src/content/blog/zh/.*\.md$' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "changed: $(git diff --name-only HEAD^ HEAD | grep 'src/content/blog/zh/.*\.md$' | tr '\n' ' ')"

      - name: Setup Node.js
        if: steps.changed.outputs.files != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Translate (guarded)
        if: steps.changed.outputs.files != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/auto-translate.mjs ${{ steps.changed.outputs.files }}

      - name: Commit translated files
        if: steps.changed.outputs.files != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/content/blog/en/
          git diff --staged --quiet || git commit -m "🤖 Auto-translate: zh -> en (guarded)"
          git push
